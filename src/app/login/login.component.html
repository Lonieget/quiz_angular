<div class="login-container">
    <div class="cyber-panel login-card">
        <h2 class="tech-font cyber-glitch" data-text="存取權限控制">存取權限控制</h2>

        @if(registerBut == false) {
        <form class="login-form">
            <div class="form-group">
                <label for="account">使用者身份識別 // ID_IDENT</label>
                <input type="text" name="account" [(ngModel)]="account" class="tech-input" placeholder="INPUT_ID...">
            </div>

            <div class="form-group">
                <label for="password">安全驗證協定 // SEC_AUTH</label>
                <input type="password" name="password" [(ngModel)]="passwrod" class="tech-input"
                    placeholder="INPUT_KEY...">
            </div>

            <div class="action-row">
                <button type="submit" (click)="login()" class="tech-button">授權登入 (AUTH)</button>
                <span (click)="register()" class="link-text">初始化新身分 // NEW_PROFILE</span>
            </div>
        </form>
        } @else {
        <form class="register-form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="account">帳號識別</label>
                    <input type="text" name="account" [(ngModel)]="account" class="tech-input">
                </div>
                <div class="form-group">
                    <label for="password">安全密鑰</label>
                    <input type="password" name="password" [(ngModel)]="passwrod" class="tech-input">
                </div>
                <div class="form-group">
                    <label for="name">使用者姓名</label>
                    <input type="text" name="name" [(ngModel)]="name" class="tech-input">
                </div>
                <div class="form-group">
                    <label for="phone">聯絡通訊</label>
                    <input type="text" name="phone" [(ngModel)]="phone" class="tech-input">
                </div>
                <div class="form-group">
                    <label for="email">電子郵件位址</label>
                    <input type="text" name="email" [(ngModel)]="email" class="tech-input">
                </div>
                <div class="form-group">
                    <label for="age">生理年齡</label>
                    <input type="number" name="age" [(ngModel)]="age" class="tech-input">
                </div>
                <div class="form-group">
                    <label for="gender">性別參數</label>
                    <select name="gender" [(ngModel)]="gender" class="tech-input">
                        <option value="" disabled selected>SELECT_PARAM</option>
                        <option value="M">男性 (MALE)</option>
                        <option value="F">女性 (FEMALE)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="role">使用者角色</label>
                    <select name="role" [(ngModel)]="role" class="tech-input">
                        <option value="" disabled selected>SELECT_PARAM</option>
                        <option value="USER">一般用戶 (USER)</option>
                        <option value="ADMIN">管理員 (ADMIN)</option>
                    </select>
                </div>
            </div>

            <div class="action-row">
                <button (click)="register()" class="tech-button danger">中止程序 (ABORT)</button>
                <button (click)="registerUser()" class="tech-button">提交註冊 (COMMIT)</button>
            </div>
        </form>
        }
    </div>
</div>
